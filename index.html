<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rock Paper Scissors!</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1 id="main-header">Let's play Rock, Paper, Scissors!</h1>

  <div class="player-choice-container">
    <h2 id="player-choice-header">Choose your weapon:</h2>
    <div class="player-choice-buttons">
      <button id="rock">Rock</button>
      <button id="paper">Paper</button>
      <button id="scissors">Scissors</button>
    </div>
  </div>

  <div class="scoreboard">
    <div class="game-msg-container">Start game by selecting your first weapon...</div>
    <h2>Scores:</h2>
    <div class="scores-container">
      <div class="player-score">
        <h3>You:</h3>
        <div class="score-txt">0</div>
      </div>
      <div class="computer-score">
        <h3>Computer:</h3>
        <div class="score-txt">0</div>
      </div>
    </div>
  </div>
  
  <script src="./script.js"></script>
</body>
</html>
